name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange uploaded files into folders
        run: |
          mkdir -p assets scripts
          for f in icon-only.png icon-foreground.png icon-background.png splash.png splash-dark.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done
          if [ -f build-vendor.sh ]; then mv build-vendor.sh scripts/; fi
          if [ -f debug.keystore ]; then mv debug.keystore scripts/; fi
          ls assets scripts

      - name: Install dependencies
        run: npm install

      - name: Build offline libraries (Tailwind, fonts, Firebase, JSZip)
        continue-on-error: true
        run: bash scripts/build-vendor.sh

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app icon and splash screen
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#059669' --splashBackgroundColor '#059669'

      - name: Add permissions (location, notifications)
        run: |
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml

      - name: Sync web files
        run: npx cap sync android

      - name: Use fixed signing key (so new APKs install over old ones)
        run: |
          mkdir -p ~/.android
          cp scripts/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kobutor-palok.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kobutor-palok-apk
          path: kobutor-palok.apk

      - name: Publish download link (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: কবুতর পালক APK (build ${{ github.run_number }})
          files: kobutor-palok.apk
